# Pre-commit configuration for the ml-homelab Streamlit and Ray application.
# See https://pre-commit.com for more information.
#
# Python tooling (ruff, ty, pytest) runs through `uv run` so the versions used
# here always match the ones pinned in uv.lock.

repos:
  # Basic file checks and cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        description: Lint and sort imports with ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        description: Format Python code with ruff
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty (type check)
        description: Type check with ty
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest (with coverage)
        description: Run the test suite and enforce the coverage floor
        entry: uv run pytest --cov
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

default_language_version:
  python: python3.12

exclude: |
  (?x)^(
    \.venv/|
    data/|
    uv\.lock
  )
