services:

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus_server
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./data/prometheus:/prometheus
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:12.4.1
    container_name: grafana_server
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Allow Grafana to be embedded in Ray Dashboard iframes
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  floci:
    image: floci/floci:latest-compat
    container_name: floci_server
    ports:
      # Loopback by default. Floci accepts any non-empty credential and does
      # not validate signatures, so publishing on 0.0.0.0 would hand every
      # object in every bucket to anyone on the network. Set FLOCI_BIND_HOST
      # to 0.0.0.0 only on a network you trust.
      - "${FLOCI_BIND_HOST:-127.0.0.1}:${FLOCI_PORT:-4566}:4566"
    volumes:
      - ./data/floci:/app/data
      - ./config/floci/init/ready.d:/etc/floci/init/ready.d:ro
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped
    healthcheck:
      # The compat image is RHEL-based and ships curl but not wget, unlike the
      # Alpine services above.
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
