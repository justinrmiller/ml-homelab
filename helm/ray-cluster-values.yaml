# Ray Cluster Helm Values
# Customize these settings for your environment.
# See: https://github.com/ray-project/kuberay-helm/tree/main/helm-chart/ray-cluster

image:
  # tag is set dynamically per-architecture in kuberay-init.sh
  # ARM (Apple Silicon): 2.58.0-py312-aarch64
  # x86_64:              2.58.0-py312
  pullPolicy: IfNotPresent

head:
  rayStartParams:
    port: "6379"
    dashboard-port: "8265"
    ray-client-server-port: "10001"
    dashboard-host: "0.0.0.0"
    metrics-export-port: "8080"
    # The head coordinates; it should not also compete for work. Advertising 0
    # CPUs keeps tasks on the workers, which is what the CPU budget below
    # assumes. Ray still runs the GCS, dashboard, and autoscaler here.
    num-cpus: "0"
  containerEnv:
    # RAY_GRAFANA_HOST: used server-side by the dashboard to proxy Grafana requests.
    # RAY_GRAFANA_IFRAME_HOST: used client-side (browser) for Grafana iframe URLs.
    # RAY_PROMETHEUS_HOST: used server-side to query Prometheus for time-series data.
    #
    # Server-side URLs (RAY_GRAFANA_HOST, RAY_PROMETHEUS_HOST) must be reachable
    # from inside the pod. kuberay-init.sh connects the Prometheus and Grafana
    # containers to the Kind network and injects their IPs via --set overrides.
    # The placeholder values below are overridden at deploy time.
    - name: RAY_GRAFANA_HOST
      value: "http://grafana:3000"
    - name: RAY_PROMETHEUS_HOST
      value: "http://prometheus:9090"
    - name: RAY_GRAFANA_IFRAME_HOST
      value: "http://localhost:3000"
    - name: RAY_PROMETHEUS_NAME
      value: "Prometheus"
  # requests == limits on purpose. KubeRay derives Ray's advertised --num-cpus
  # and --memory from the *limits*, so a lower request lets Ray believe it owns
  # capacity Kubernetes never guaranteed it, and the node oversubscribes.
  # Matching them also gives the pod Guaranteed QoS.
  #
  # 2Gi was not enough. Ray 2.58 runs each dashboard module as its own process
  # (ServeHead, DataHead, JobHead, MetricsHead, ...) at ~120-220MB apiece, so
  # an idle head already sits near 1.5GB — close enough to Ray's 95% OOM
  # threshold that anything else scheduled there gets a worker killed. Job
  # drivers now run on the workers (see ENTRYPOINT_NUM_CPUS in
  # streamlit_app/job_runner.py); this leaves the head roughly 1GB of slack for
  # its own growth.
  resources:
    limits:
      cpu: "500m"
      memory: "2560Mi"
    requests:
      cpu: "500m"
      memory: "2560Mi"

# Sized for the default single-node Kind cluster. The whole budget is the
# container VM (podman machine / Docker Desktop), and Kubernetes' own system
# pods need about 1050m CPU of it, measured with:
#   kubectl describe node kind-control-plane | sed -n '/Allocated resources/,/Events/p'
# On a 6 CPU / 11GiB VM that leaves ~4950m, so the head takes 500m and the two
# workers 2000m each: 4500m total, with headroom. Ray gets 4 CPUs of actual
# compute, all of it on the workers.
#
# Memory works out to 2.5Gi (head) + 2 x 3Gi = 8.5Gi of the ~10.8Gi the node
# reports allocatable, leaving ~1.5Gi. The workers hold the whole job: the
# driver reserves one CPU on one of them and each Tune trial takes another,
# so a worker may be running a driver plus a torch trial at once.
#
# Do not raise the head to a full CPU without lowering the workers — 500m +
# (2 x 2000m) + 1050m system already comes to 5550m of 6000m.
#
# Raising these past what the VM has does not fail loudly — the Ray pods simply
# sit in Pending forever. Check the VM's size first:
#   podman machine list          (or: docker info | grep -E 'CPUs|Total Memory')
#
# replicas and the worker CPU count are overridden at deploy time from
# NUM_CPU_WORKERS and NUM_CPUS_PER_WORKER in .env; see scripts/kuberay-init.sh.
worker:
  replicas: 2
  resources:
    limits:
      cpu: "2"
      memory: "3Gi"
    requests:
      cpu: "2"
      memory: "3Gi"
